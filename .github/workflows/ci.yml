name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Check, test, build, and validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The docs read each page's last-modified date from git history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run release:check
      - run: bun run release:build
      - run: bun run test:registry
      - run: bun run registry:validate
      - run: bun run --filter @domain-sdk/docs check:snippets
      - run: bun run --filter @domain-sdk/docs validate
      - run: bun run --filter @domain-sdk/docs build
      - run: bun -e 'import { readFileSync } from "node:fs"; const cfg = JSON.parse(readFileSync("apps/docs/.vercel/output/config.json", "utf8")); const routes = cfg.routes.map((r) => r.src); const ingest = routes.indexOf("^/ingest(?:/(.*))?$"); const slash = routes.indexOf("^/(.*)/$"); if (ingest < 0 || slash < 0 || ingest > slash) throw new Error("Missing or misordered /ingest route in Vercel config"); const entry = readFileSync("apps/docs/.vercel/output/functions/_render.func/apps/docs/dist/server/entry.mjs", "utf8"); if (!entry.includes("/* patch-vercel-routes:ingest-trailing-slash */")) throw new Error("Missing ingest trailing-slash patch in server entry");'
      - run: bun run --filter @domain-sdk/docs audit
